<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dualler Web 演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    .simulator {
      max-width: 414px;
      margin: 20px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .status-bar {
      background: #1a73e8;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .nav-bar {
      background: #1a73e8;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
    .content {
      min-height: 600px;
      overflow-y: auto;
    }
    .tab-bar {
      display: flex;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .tab-item {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      color: #999;
      cursor: pointer;
    }
    .tab-item.active {
      color: #1a73e8;
    }
    .devtools {
      max-width: 414px;
      margin: 20px auto;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }
    .devtools-header {
      background: #333;
      color: #fff;
      padding: 8px 16px;
      font-size: 12px;
    }
    .devtools-content {
      padding: 16px;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-entry { margin-bottom: 4px; }
    .log-info { color: #0f0; }
    .log-warn { color: #ff0; }
    .log-error { color: #f00; }
  </style>
</head>
<body>

<h1 style="text-align: center; margin: 20px;">Dualler Web 演示</h1>
<p style="text-align: center; color: #666;">小程序在浏览器中运行的演示</p>

<div class="simulator">
  <div class="status-bar">
    <span>9:41</span>
    <span>🔋 100%</span>
  </div>
  <div class="nav-bar">Dualler 示例</div>
  <div class="content" id="app">
    <!-- 小程序内容将在这里渲染 -->
  </div>
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('index')">首页</div>
    <div class="tab-item" onclick="switchTab('profile')">我的</div>
  </div>
</div>

<div class="devtools">
  <div class="devtools-header">DevTools Console</div>
  <div class="devtools-content" id="console"></div>
</div>

<script>
// Dualler Web 平台简化实现
const Dualler = {
  // 日志系统
  log: function(level, ...args) {
    const consoleEl = document.getElementById('console');
    const entry = document.createElement('div');
    entry.className = `log-entry log-${level}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] [${level.toUpperCase()}] ${args.join(' ')}`;
    consoleEl.appendChild(entry);
    consoleEl.scrollTop = consoleEl.scrollHeight;
    console.log(`[${level}]`, ...args);
  },

  // Toast 提示
  showToast: function(opts) {
    this.log('info', `Toast: ${opts.title}`);
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;z-index:999;';
    toast.textContent = opts.title;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), opts.duration || 1500);
  },

  // 模态弹窗
  showModal: function(opts) {
    this.log('info', `Modal: ${opts.title} - ${opts.content}`);
    const confirmed = confirm(`${opts.title}\n\n${opts.content}`);
    if (opts.success) opts.success({ confirm: confirmed, cancel: !confirmed });
  },

  // 获取系统信息
  getSystemInfo: function(opts) {
    const info = {
      brand: navigator.vendor || 'Browser',
      model: navigator.userAgent.split('(')[1]?.split(')')[0] || 'Web',
      pixelRatio: window.devicePixelRatio,
      screenWidth: window.screen.width,
      screenHeight: window.screen.height,
      windowWidth: window.innerWidth,
      windowHeight: window.innerHeight,
      language: navigator.language,
      platform: 'web',
      SDKVersion: '1.0.0'
    };
    this.log('info', 'SystemInfo:', JSON.stringify(info));
    if (opts.success) opts.success(info);
  },

  // 网络请求
  request: function(opts) {
    this.log('info', `Request: ${opts.method || 'GET'} ${opts.url}`);
    fetch(opts.url, {
      method: opts.method || 'GET',
      headers: opts.headers
    })
    .then(res => res.json())
    .then(data => {
      this.log('info', 'Response:', JSON.stringify(data).substring(0, 100));
      if (opts.success) opts.success({ statusCode: 200, data });
    })
    .catch(err => {
      this.log('error', 'Request failed:', err.message);
      if (opts.fail) opts.fail({ errMsg: err.message });
    });
  },

  // 存储
  storage: {},
  setStorageSync: function(key, value) {
    this.storage[key] = value;
    localStorage.setItem(`dualler_${key}`, JSON.stringify(value));
    this.log('info', `Storage SET: ${key} = ${value}`);
  },
  getStorageSync: function(key) {
    const value = this.storage[key] || JSON.parse(localStorage.getItem(`dualler_${key}`) || 'null');
    this.log('info', `Storage GET: ${key} = ${value}`);
    return value;
  },
  clearStorageSync: function() {
    this.storage = {};
    Object.keys(localStorage).filter(k => k.startsWith('dualler_')).forEach(k => localStorage.removeItem(k));
    this.log('info', 'Storage CLEARED');
  }
};

// 全局 wx 对象
const wx = Dualler;

// 当前页面
let currentPage = 'index';

// 页面数据
const pageData = {
  index: {
    count: 0,
    todos: [
      { text: '学习 Dualler 框架', done: false },
      { text: '编写小程序示例', done: false },
      { text: '测试跨平台功能', done: false }
    ]
  },
  profile: {
    systemInfo: null
  }
};

// 渲染首页
function renderIndex() {
  const data = pageData.index;
  return `
    <div style="padding: 16px;">
      <div style="text-align:center;padding:20px 0;">
        <h2 style="color:#1a73e8;">Dualler 示例</h2>
        <p style="color:#666;font-size:14px;">Vue3 小程序引擎</p>
      </div>

      <div style="background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <h3 style="margin-bottom:12px;">计数器</h3>
        <div style="text-align:center;font-size:48px;font-weight:bold;color:#1a73e8;margin:16px 0;">${data.count}</div>
        <div style="display:flex;gap:8px;">
          <button onclick="increment()" style="flex:1;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">+1</button>
          <button onclick="decrement()" style="flex:1;padding:10px;background:#6c757d;color:#fff;border:none;border-radius:6px;cursor:pointer;">-1</button>
          <button onclick="resetCount()" style="flex:1;padding:10px;background:#dc3545;color:#fff;border:none;border-radius:6px;cursor:pointer;">重置</button>
        </div>
      </div>

      <div style="background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <h3 style="margin-bottom:12px;">待办事项</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input id="newTodo" type="text" placeholder="添加新任务" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;">
          <button onclick="addTodo()" style="padding:8px 16px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">添加</button>
        </div>
        <div id="todoList">
          ${data.todos.map((todo, i) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;">
              <span style="${todo.done ? 'text-decoration:line-through;color:#999;' : ''}">${todo.text}</span>
              <div style="display:flex;gap:4px;">
                <button onclick="toggleTodo(${i})" style="padding:4px 8px;font-size:12px;border:1px solid #ddd;border-radius:4px;cursor:pointer;">${todo.done ? '撤销' : '完成'}</button>
                <button onclick="removeTodo(${i})" style="padding:4px 8px;font-size:12px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;">删除</button>
              </div>
            </div>
          `).join('')}
        </div>
        ${data.todos.length === 0 ? '<p style="text-align:center;color:#999;padding:16px;">暂无任务</p>' : ''}
      </div>

      <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <h3 style="margin-bottom:12px;">API 示例</h3>
        <button onclick="showToastDemo()" style="display:block;width:100%;padding:10px;margin-bottom:8px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">显示 Toast</button>
        <button onclick="getSystemInfoDemo()" style="display:block;width:100%;padding:10px;margin-bottom:8px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">获取设备信息</button>
        <button onclick="showModalDemo()" style="display:block;width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">显示弹窗</button>
      </div>
    </div>
  `;
}

// 渲染个人页
function renderProfile() {
  const info = pageData.profile.systemInfo;
  return `
    <div style="padding: 16px;">
      <div style="background:linear-gradient(135deg,#1a73e8,#4a90d9);border-radius:12px;padding:24px;margin-bottom:12px;color:#fff;">
        <div style="display:flex;align-items:center;">
          <div style="width:60px;height:60px;border-radius:30px;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;margin-right:16px;">D</div>
          <div>
            <div style="font-size:18px;font-weight:bold;">Dualler 用户</div>
            <div style="font-size:12px;opacity:0.8;">ID: 10001</div>
          </div>
        </div>
      </div>

      <div style="background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <div onclick="storageDemo()" style="padding:16px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;">
          <span>本地存储</span><span style="color:#999;">›</span>
        </div>
        <div onclick="networkDemo()" style="padding:16px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;">
          <span>网络请求</span><span style="color:#999;">›</span>
        </div>
        <div onclick="showModalDemo()" style="padding:16px;cursor:pointer;display:flex;justify-content:space-between;">
          <span>弹窗示例</span><span style="color:#999;">›</span>
        </div>
      </div>

      ${info ? `
        <div style="background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
          <h3 style="margin-bottom:12px;">设备信息</h3>
          <div style="font-size:14px;color:#666;">
            <p>品牌：${info.brand}</p>
            <p>型号：${info.model}</p>
            <p>屏幕：${info.screenWidth} x ${info.screenHeight}</p>
            <p>像素比：${info.pixelRatio}</p>
            <p>语言：${info.language}</p>
          </div>
        </div>
      ` : ''}

      <div style="text-align:center;padding:20px;color:#999;font-size:12px;">
        Dualler SDK v1.0.0 | Web 平台
      </div>
    </div>
  `;
}

// 切换 Tab
function switchTab(page) {
  currentPage = page;
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

// 渲染页面
function render() {
  const app = document.getElementById('app');
  if (currentPage === 'index') {
    app.innerHTML = renderIndex();
  } else {
    app.innerHTML = renderProfile();
  }
}

// 计数器函数
function increment() {
  pageData.index.count++;
  wx.showToast({ title: `计数: ${pageData.index.count}` });
  render();
}

function decrement() {
  if (pageData.index.count > 0) {
    pageData.index.count--;
    render();
  }
}

function resetCount() {
  pageData.index.count = 0;
  wx.showToast({ title: '已重置' });
  render();
}

// 待办函数
function addTodo() {
  const input = document.getElementById('newTodo');
  if (input.value.trim()) {
    pageData.index.todos.push({ text: input.value.trim(), done: false });
    input.value = '';
    wx.showToast({ title: '添加成功' });
    render();
  }
}

function toggleTodo(index) {
  pageData.index.todos[index].done = !pageData.index.todos[index].done;
  render();
}

function removeTodo(index) {
  pageData.index.todos.splice(index, 1);
  wx.showToast({ title: '已删除' });
  render();
}

// API 示例
function showToastDemo() {
  wx.showToast({ title: '这是一个 Toast 提示', duration: 2000 });
}

function showModalDemo() {
  wx.showModal({
    title: '提示',
    content: '这是一个模态弹窗',
    success(res) {
      wx.log('info', `用户点击了: ${res.confirm ? '确定' : '取消'}`);
    }
  });
}

function getSystemInfoDemo() {
  wx.getSystemInfo({
    success(info) {
      pageData.profile.systemInfo = info;
      wx.showToast({ title: '获取成功' });
      if (currentPage === 'profile') render();
    }
  });
}

function storageDemo() {
  wx.setStorageSync('testKey', 'Hello Dualler!');
  const value = wx.getStorageSync('testKey');
  wx.showModal({
    title: '存储测试',
    content: `读取到的值: ${value}`
  });
}

function networkDemo() {
  wx.request({
    url: 'https://jsonplaceholder.typicode.com/posts/1',
    method: 'GET',
    success(res) {
      wx.showModal({
        title: '网络请求',
        content: `状态码: ${res.statusCode}\n标题: ${res.data.title}`
      });
    }
  });
}

// 初始化
Dualler.log('info', 'Dualler Web 演示启动');
Dualler.log('info', '平台: Web Browser');
Dualler.log('info', 'SDK 版本: 1.0.0');
render();
</script>

</body>
</html>
