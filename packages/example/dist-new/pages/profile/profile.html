<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/pages/profile/profile.css">
</head>
<body>
  <div id="app">
    
  <div class="container" data-v-18601234>
    <!-- 用户信息 -->
    <div class="user-card" data-v-18601234>
      <div class="avatar" data-v-18601234>
        <span class="avatar-text" data-v-18601234>{{ user.name.charAt(0) }}</span>
      </div>
      <div class="user-info" data-v-18601234>
        <span class="user-name" data-v-18601234>{{ user.name }}</span>
        <span class="user-id" data-v-18601234>ID: {{ user.id }}</span>
      </div>
    </div>

    <!-- 功能列表 -->
    <div class="menu-card" data-v-18601234>
      <div class="menu-item" @click="showStorage" data-v-18601234>
        <span class="menu-text" data-v-18601234>本地存储</span>
        <span class="menu-arrow" data-v-18601234>›</span>
      </div>
      <div class="menu-item" @click="showNetwork" data-v-18601234>
        <span class="menu-text" data-v-18601234>网络请求</span>
        <span class="menu-arrow" data-v-18601234>›</span>
      </div>
      <div class="menu-item" @click="testWorker" data-v-18601234>
        <span class="menu-text" data-v-18601234>Worker 测试</span>
        <span class="menu-arrow" data-v-18601234>›</span>
      </div>
      <div class="menu-item" @click="showModal" data-v-18601234>
        <span class="menu-text" data-v-18601234>弹窗示例</span>
        <span class="menu-arrow" data-v-18601234>›</span>
      </div>
    </div>

    <!-- 存储示例 -->
    <div v-if="showStoragePanel" class="card" data-v-18601234>
      <span class="card-title" data-v-18601234>本地存储</span>
      <div class="storage-item" data-v-18601234>
        <input class="input" placeholder="输入 Key" :value="storageKey" @input="onKeyInput" data-v-18601234 />
        <input class="input" placeholder="输入 Value" :value="storageValue" @input="onValueInput" data-v-18601234 />
        <button class="btn btn-primary" @click="saveStorage" data-v-18601234>保存</button>
      </div>
      <button class="btn btn-block" @click="readStorage" data-v-18601234>读取</button>
      <button class="btn btn-block btn-danger" @click="clearStorage" data-v-18601234>清空</button>
      <span v-if="storageResult" class="result" data-v-18601234>{{ storageResult }}</span>
    </div>

    <!-- 网络请求示例 -->
    <div v-if="showNetworkPanel" class="card" data-v-18601234>
      <span class="card-title" data-v-18601234>网络请求</span>
      <button class="btn btn-block" @click="makeRequest" data-v-18601234>发送 GET 请求</button>
      <div v-if="networkResult" class="network-result" data-v-18601234>
        <span class="result-title" data-v-18601234>响应：</span>
        <span class="result-content" data-v-18601234>{{ networkResult }}</span>
      </div>
    </div>

    <!-- Worker 测试 -->
    <div v-if="showWorkerPanel" class="card" data-v-18601234>
      <span class="card-title" data-v-18601234>Worker 测试</span>
      <span class="worker-desc" data-v-18601234>使用 Worker 进行 CPU 密集计算</span>
      <button class="btn btn-block" @click="runWorker" data-v-18601234>运行排序任务</button>
      <div v-if="workerResult" class="worker-result" data-v-18601234>
        <span class="result-title" data-v-18601234>结果：</span>
        <span class="result-content" data-v-18601234>{{ workerResult }}</span>
      </div>
    </div>

    <!-- 版本信息 -->
    <div class="version-card" data-v-18601234>
      <span class="version" data-v-18601234>Dualler SDK v1.0.0</span>
      <span class="platform" data-v-18601234>平台: {{ platform }}</span>
    </div>
  </div>

  </div>
  <script src="/pages/profile/profile.js"></script>
</body>
</html>
