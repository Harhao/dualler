<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/pages/index/index.css">
</head>
<body>
  <div id="app">
    
  <div class="container" data-v-c2441bd3>
    <!-- 头部 -->
    <div class="header" data-v-c2441bd3>
      <span class="title" data-v-c2441bd3>Dualler 示例</span>
      <span class="subtitle" data-v-c2441bd3>Vue3 小程序引擎</span>
    </div>

    <!-- 计数器示例 -->
    <div class="card" data-v-c2441bd3>
      <span class="card-title" data-v-c2441bd3>计数器</span>
      <span class="count" data-v-c2441bd3>{{ count }}</span>
      <div class="btn-group" data-v-c2441bd3>
        <button class="btn btn-primary" @click="increment" data-v-c2441bd3>+1</button>
        <button class="btn btn-secondary" @click="decrement" data-v-c2441bd3>-1</button>
        <button class="btn btn-danger" @click="reset" data-v-c2441bd3>重置</button>
      </div>
    </div>

    <!-- 列表示例 -->
    <div class="card" data-v-c2441bd3>
      <span class="card-title" data-v-c2441bd3>待办事项</span>
      <div class="input-group" data-v-c2441bd3>
        <input
          class="input"
          placeholder="添加新任务"
          :value="newTodo"
          @input="onInput" data-v-c2441bd3
        />
        <button class="btn btn-primary" @click="addTodo" data-v-c2441bd3>添加</button>
      </div>
      <div class="todo-list" data-v-c2441bd3>
        <div
          v-for="(todo, index) in todos"
          :key="index"
          class="todo-item" data-v-c2441bd3
        >
          <span :class="{ 'todo-done': todo.done }" data-v-c2441bd3>{{ todo.text }}</span>
          <div class="todo-actions" data-v-c2441bd3>
            <button class="btn btn-sm" @click="toggleTodo(index)" data-v-c2441bd3>
              {{ todo.done ? '撤销' : '完成' }}
            </button>
            <button class="btn btn-sm btn-danger" @click="removeTodo(index)" data-v-c2441bd3>
              删除
            </button>
          </div>
        </div>
      </div>
      <span v-if="todos.length === 0" class="empty" data-v-c2441bd3>暂无任务</span>
    </div>

    <!-- API 示例 -->
    <div class="card" data-v-c2441bd3>
      <span class="card-title" data-v-c2441bd3>API 示例</span>
      <button class="btn btn-block" @click="showToast" data-v-c2441bd3>显示 Toast</button>
      <button class="btn btn-block" @click="getSystemInfo" data-v-c2441bd3>获取设备信息</button>
      <button class="btn btn-block" @click="navigateToDetail" data-v-c2441bd3>跳转详情页</button>
    </div>

    <!-- 设备信息 -->
    <div v-if="systemInfo" class="card" data-v-c2441bd3>
      <span class="card-title" data-v-c2441bd3>设备信息</span>
      <div class="info-item" data-v-c2441bd3>
        <span class="info-label" data-v-c2441bd3>品牌：</span>
        <span class="info-value" data-v-c2441bd3>{{ systemInfo.brand }}</span>
      </div>
      <div class="info-item" data-v-c2441bd3>
        <span class="info-label" data-v-c2441bd3>型号：</span>
        <span class="info-value" data-v-c2441bd3>{{ systemInfo.model }}</span>
      </div>
      <div class="info-item" data-v-c2441bd3>
        <span class="info-label" data-v-c2441bd3>屏幕：</span>
        <span class="info-value" data-v-c2441bd3>{{ systemInfo.screenWidth }} x {{ systemInfo.screenHeight }}</span>
      </div>
      <div class="info-item" data-v-c2441bd3>
        <span class="info-label" data-v-c2441bd3>语言：</span>
        <span class="info-value" data-v-c2441bd3>{{ systemInfo.language }}</span>
      </div>
    </div>
  </div>

  </div>
  <script src="/pages/index/index.js"></script>
</body>
</html>
