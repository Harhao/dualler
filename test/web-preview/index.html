<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dualler Web 预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .wrapper {
      display: flex;
      gap: 20px;
      max-width: 1200px;
    }
    .phone {
      flex-shrink: 0;
    }
    .simulator {
      width: 375px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .status-bar {
      background: #1a73e8;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .nav-bar {
      background: #1a73e8;
      color: #fff;
      padding: 14px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
    .content {
      height: 600px;
      overflow-y: auto;
    }
    .tab-bar {
      display: flex;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .tab-item {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #999;
      cursor: pointer;
    }
    .tab-item.active { color: #1a73e8; }

    .sidebar {
      flex: 1;
      min-width: 300px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h3 {
      margin-bottom: 12px;
      font-size: 14px;
      color: #333;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1557b0; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #545b62; }

    .devtools {
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }
    .devtools-header {
      background: #333;
      color: #fff;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .devtools-content {
      padding: 8px;
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      height: 200px;
      overflow-y: auto;
    }
    .log { margin-bottom: 2px; }
    .log-info { color: #0f0; }
    .log-warn { color: #ff0; }
    .log-error { color: #f00; }

    .file-info {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
    .file-info code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- 手机模拟器 -->
  <div class="phone">
    <div class="simulator">
      <div class="status-bar">
        <span>9:41</span>
        <span>🔋 100%</span>
      </div>
      <div class="nav-bar" id="navTitle">Dualler 示例</div>
      <div class="content" id="app">
        <div style="padding:40px;text-align:center;color:#999;">
          点击右侧「加载小程序」按钮开始预览
        </div>
      </div>
      <div class="tab-bar">
        <div class="tab-item active" id="tab-index" onclick="switchTab('index')">首页</div>
        <div class="tab-item" id="tab-detail" onclick="switchTab('detail')">详情</div>
        <div class="tab-item" id="tab-profile" onclick="switchTab('profile')">我的</div>
      </div>
    </div>
  </div>

  <!-- 控制面板 -->
  <div class="sidebar">
    <div class="card">
      <h3>📱 小程序预览</h3>
      <p style="font-size:13px;color:#666;margin-bottom:12px;">
        加载编译后的小程序文件进行预览
      </p>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="loadMiniProgram()">加载小程序</button>
        <button class="btn btn-secondary" onclick="reloadPage()">刷新页面</button>
      </div>
      <div class="file-info">
        加载路径: <code>packages/example/dist/</code>
      </div>
    </div>

    <div class="card">
      <h3>📄 文件选择</h3>
      <p style="font-size:13px;color:#666;margin-bottom:12px;">
        选择编译后的文件进行预览
      </p>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;color:#666;">HTML 文件:</label>
        <input type="file" id="htmlFile" accept=".html" style="font-size:12px;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;color:#666;">CSS 文件:</label>
        <input type="file" id="cssFile" accept=".css" style="font-size:12px;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;color:#666;">JS 文件:</label>
        <input type="file" id="jsFile" accept=".js" style="font-size:12px;">
      </div>
      <button class="btn btn-primary" onclick="loadFromFiles()" style="margin-top:8px;">加载文件</button>
    </div>

    <div class="card">
      <h3>⚙️ 配置</h3>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;color:#666;">App ID:</label>
        <input type="text" id="appId" value="com.example.dualler-demo" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:12px;">
      </div>
      <div>
        <label style="font-size:12px;color:#666;">首页:</label>
        <input type="text" id="entryPage" value="pages/index/index" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:12px;">
      </div>
    </div>

    <div class="devtools">
      <div class="devtools-header">
        <span>Console</span>
        <button onclick="clearLog()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:11px;">Clear</button>
      </div>
      <div class="devtools-content" id="console"></div>
    </div>
  </div>
</div>

<script>
// Dualler Web 运行时
const Dualler = {
  log(level, ...args) {
    const el = document.getElementById('console');
    const div = document.createElement('div');
    div.className = `log log-${level}`;
    div.textContent = `[${new Date().toLocaleTimeString()}] ${args.join(' ')}`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log'](...args);
  },

  showToast(opts) {
    this.log('info', `wx.showToast: ${opts.title}`);
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;z-index:999;font-size:14px;';
    toast.textContent = opts.title;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), opts.duration || 1500);
  },

  showModal(opts) {
    this.log('info', `wx.showModal: ${opts.title}`);
    const confirmed = confirm(`${opts.title}\n\n${opts.content}`);
    if (opts.success) opts.success({ confirm: confirmed, cancel: !confirmed });
  },

  getSystemInfo(opts) {
    const info = {
      brand: navigator.vendor || 'Browser',
      model: 'Web',
      pixelRatio: window.devicePixelRatio,
      screenWidth: window.screen.width,
      screenHeight: window.screen.height,
      windowWidth: window.innerWidth,
      windowHeight: window.innerHeight,
      language: navigator.language,
      platform: 'web',
      SDKVersion: '1.0.0'
    };
    this.log('info', 'wx.getSystemInfo:', JSON.stringify(info));
    if (opts.success) opts.success(info);
  },

  navigateTo(opts) {
    this.log('info', `wx.navigateTo: ${opts.url}`);
    // 模拟页面跳转
  },

  navigateBack() {
    this.log('info', 'wx.navigateBack');
  }
};

const wx = Dualler;

// 页面状态
let currentPage = 'index';
let pageLoaded = false;

// 加载小程序
async function loadMiniProgram() {
  const appId = document.getElementById('appId').value;
  const entryPage = document.getElementById('entryPage').value;

  Dualler.log('info', `加载小程序: ${appId}`);
  Dualler.log('info', `入口页面: ${entryPage}`);

  try {
    // 加载首页 HTML
    const htmlResponse = await fetch(`../../packages/example/dist/${entryPage}.html`);
    if (!htmlResponse.ok) throw new Error(`HTML 加载失败: ${htmlResponse.status}`);
    const html = await htmlResponse.text();

    // 加载首页 CSS
    let css = '';
    try {
      const cssResponse = await fetch(`../../packages/example/dist/${entryPage}.css`);
      if (cssResponse.ok) css = await cssResponse.text();
    } catch (e) {}

    // 加载首页 JS
    let js = '';
    try {
      const jsResponse = await fetch(`../../packages/example/dist/${entryPage}.js`);
      if (jsResponse.ok) js = await jsResponse.text();
    } catch (e) {}

    // 渲染页面
    renderPage(html, css, js);
    pageLoaded = true;
    Dualler.log('info', '小程序加载成功');
  } catch (error) {
    Dualler.log('error', `加载失败: ${error.message}`);
    Dualler.log('info', '请确保已编译小程序: cd packages/compiler && npm run build && node dist/cli.js build ...');
  }
}

// 从文件加载
function loadFromFiles() {
  const htmlFile = document.getElementById('htmlFile').files[0];
  const cssFile = document.getElementById('cssFile').files[0];
  const jsFile = document.getElementById('jsFile').files[0];

  if (!htmlFile) {
    Dualler.log('warn', '请选择 HTML 文件');
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(e) {
    const html = e.target.result;
    let css = '';
    let js = '';

    if (cssFile) {
      const cssReader = new FileReader();
      cssReader.onload = function(e) { css = e.target.result; };
      cssReader.readAsText(cssFile);
    }

    if (jsFile) {
      const jsReader = new FileReader();
      jsReader.onload = function(e) { js = e.target.result; };
      jsReader.readAsText(jsFile);
    }

    // 等待文件读取完成
    await new Promise(resolve => setTimeout(resolve, 100));

    renderPage(html, css, js);
    pageLoaded = true;
    Dualler.log('info', '文件加载成功');
  };

  reader.readAsText(htmlFile);
}

// 渲染页面
function renderPage(html, css, js) {
  const app = document.getElementById('app');

  const fullHtml = `
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, sans-serif; font-size: 14px; color: #333; background: #f5f5f5; }
      view { display: block; }
      text { display: inline; }
      button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; }
      button:active { background: #f0f0f0; }
      input, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
      ${css}
    </style>
    <div id="page-app">${html}</div>
    <script>
      var wx = parent.wx || {
        showToast: function(opts) { console.log('showToast', opts); },
        showModal: function(opts) { console.log('showModal', opts); },
        navigateTo: function(opts) { console.log('navigateTo', opts); },
        navigateBack: function() { console.log('navigateBack'); },
        getSystemInfo: function(opts) { console.log('getSystemInfo'); }
      };
      try {
        ${js}
      } catch(e) {
        console.error('JS 执行错误:', e);
      }
    <\/script>
  `;

  // 使用 iframe 隔离渲染
  app.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:none;';
  iframe.srcdoc = fullHtml;
  app.appendChild(iframe);

  // 更新导航标题
  document.getElementById('navTitle').textContent = 'Dualler 示例';
}

// 切换标签
function switchTab(tab) {
  currentPage = tab;
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`)?.classList.add('active');

  if (pageLoaded) {
    Dualler.log('info', `切换到: ${tab}`);
  }
}

// 刷新页面
function reloadPage() {
  if (pageLoaded) {
    loadMiniProgram();
  } else {
    location.reload();
  }
}

// 清空日志
function clearLog() {
  document.getElementById('console').innerHTML = '';
}

// 初始化
Dualler.log('info', 'Dualler Web 预览启动');
Dualler.log('info', '使用说明:');
Dualler.log('info', '1. 先编译小程序: cd packages/compiler');
Dualler.log('info', '2. 执行: node dist/cli.js build --appId com.example.dualler-demo ...');
Dualler.log('info', '3. 点击「加载小程序」按钮预览');
</script>

</body>
</html>
