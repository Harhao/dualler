<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dualler Web 预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #1a73e8;
      font-size: 32px;
    }
    .header p {
      color: #666;
      margin-top: 8px;
    }
    .simulator {
      max-width: 414px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .status-bar {
      background: #1a73e8;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .nav-bar {
      background: #1a73e8;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
    .content {
      min-height: 500px;
      max-height: 600px;
      overflow-y: auto;
    }
    .tab-bar {
      display: flex;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .tab-item {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #999;
      cursor: pointer;
    }
    .tab-item.active {
      color: #1a73e8;
    }
    .controls {
      max-width: 414px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
    }
    .controls button {
      flex: 1;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .controls button:hover {
      background: #1557b0;
    }
    .devtools {
      max-width: 414px;
      margin: 20px auto;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }
    .devtools-header {
      background: #333;
      color: #fff;
      padding: 8px 16px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .devtools-content {
      padding: 12px;
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
    }
    .log { margin-bottom: 2px; }
    .log-info { color: #0f0; }
    .log-warn { color: #ff0; }
    .log-error { color: #f00; }
  </style>
</head>
<body>

<div class="header">
  <h1>Dualler Web 预览</h1>
  <p>在浏览器中预览小程序效果</p>
</div>

<div class="controls">
  <button onclick="switchPage('index')">首页</button>
  <button onclick="switchPage('detail')">详情页</button>
  <button onclick="switchPage('profile')">个人页</button>
</div>

<div class="simulator">
  <div class="status-bar">
    <span>9:41</span>
    <span>🔋 100%</span>
  </div>
  <div class="nav-bar" id="navTitle">Dualler 示例</div>
  <div class="content" id="app"></div>
  <div class="tab-bar">
    <div class="tab-item active" id="tab-index" onclick="switchTab('index')">首页</div>
    <div class="tab-item" id="tab-profile" onclick="switchTab('profile')">我的</div>
  </div>
</div>

<div class="devtools">
  <div class="devtools-header">
    <span>Console</span>
    <button onclick="clearLog()" style="background:none;border:none;color:#fff;cursor:pointer;">Clear</button>
  </div>
  <div class="devtools-content" id="console"></div>
</div>

<script>
// Dualler 运行时模拟
const Dualler = {
  log(level, ...args) {
    const el = document.getElementById('console');
    const div = document.createElement('div');
    div.className = `log log-${level}`;
    div.textContent = `[${new Date().toLocaleTimeString()}] ${args.join(' ')}`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  },
  showToast(opts) {
    this.log('info', `Toast: ${opts.title}`);
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;z-index:999;';
    toast.textContent = opts.title;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), opts.duration || 1500);
  },
  showModal(opts) {
    this.log('info', `Modal: ${opts.title}`);
    const confirmed = confirm(`${opts.title}\n\n${opts.content}`);
    if (opts.success) opts.success({ confirm: confirmed });
  },
  getSystemInfo(opts) {
    const info = {
      brand: navigator.vendor,
      model: 'Browser',
      screenWidth: window.screen.width,
      screenHeight: window.screen.height,
      platform: 'web'
    };
    if (opts.success) opts.success(info);
  }
};

const wx = Dualler;

// 页面数据
let currentPage = 'index';
const data = {
  count: 0,
  todos: [
    { text: '学习 Dualler', done: false },
    { text: '编写示例', done: false }
  ]
};

// 渲染首页
function renderIndex() {
  return `
    <div style="padding:16px;">
      <div style="background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <h3>计数器</h3>
        <div style="text-align:center;font-size:48px;font-weight:bold;color:#1a73e8;margin:16px 0;">${data.count}</div>
        <div style="display:flex;gap:8px;">
          <button onclick="data.count++;render()" style="flex:1;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">+1</button>
          <button onclick="if(data.count>0)data.count--;render()" style="flex:1;padding:10px;background:#6c757d;color:#fff;border:none;border-radius:6px;cursor:pointer;">-1</button>
          <button onclick="data.count=0;render()" style="flex:1;padding:10px;background:#dc3545;color:#fff;border:none;border-radius:6px;cursor:pointer;">重置</button>
        </div>
      </div>
      <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <h3>待办事项</h3>
        <div style="display:flex;gap:8px;margin:12px 0;">
          <input id="newTodo" placeholder="添加任务" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;">
          <button onclick="addTodo()" style="padding:8px 16px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">添加</button>
        </div>
        ${data.todos.map((t, i) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;">
            <span style="${t.done ? 'text-decoration:line-through;color:#999;' : ''}">${t.text}</span>
            <div style="display:flex;gap:4px;">
              <button onclick="data.todos[${i}].done=!data.todos[${i}].done;render()" style="padding:4px 8px;font-size:12px;border:1px solid #ddd;border-radius:4px;cursor:pointer;">${t.done ? '撤销' : '完成'}</button>
              <button onclick="data.todos.splice(${i},1);render()" style="padding:4px 8px;font-size:12px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;">删除</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div style="background:#fff;border-radius:12px;padding:16px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <h3>API 示例</h3>
        <button onclick="wx.showToast({title:'Hello Dualler!'})" style="display:block;width:100%;padding:10px;margin:8px 0;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">Toast</button>
        <button onclick="wx.showModal({title:'提示',content:'这是一个弹窗'})" style="display:block;width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;">Modal</button>
      </div>
    </div>
  `;
}

// 渲染详情页
function renderDetail() {
  return `
    <div style="padding:16px;">
      <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <h2>详情页</h2>
        <p style="color:#666;margin-top:8px;">这是一个详情页示例</p>
      </div>
      <div style="background:#fff;border-radius:12px;padding:16px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <h3>图片示例</h3>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;">
          <div style="height:100px;background:#e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;">图片 1</div>
          <div style="height:100px;background:#e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;">图片 2</div>
          <div style="height:100px;background:#e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;">图片 3</div>
          <div style="height:100px;background:#e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;">图片 4</div>
        </div>
      </div>
    </div>
  `;
}

// 渲染个人页
function renderProfile() {
  return `
    <div style="padding:16px;">
      <div style="background:linear-gradient(135deg,#1a73e8,#4a90d9);border-radius:12px;padding:24px;color:#fff;">
        <div style="display:flex;align-items:center;">
          <div style="width:60px;height:60px;border-radius:30px;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;">D</div>
          <div style="margin-left:16px;">
            <div style="font-size:18px;font-weight:bold;">Dualler 用户</div>
            <div style="font-size:12px;opacity:0.8;">ID: 10001</div>
          </div>
        </div>
      </div>
      <div style="background:#fff;border-radius:12px;margin-top:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div onclick="wx.showToast({title:'本地存储功能'})" style="padding:16px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;"><span>本地存储</span><span style="color:#999;">›</span></div>
        <div onclick="wx.showToast({title:'网络请求功能'})" style="padding:16px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;"><span>网络请求</span><span style="color:#999;">›</span></div>
        <div onclick="wx.showModal({title:'Dualler SDK',content:'版本 1.0.0'})" style="padding:16px;cursor:pointer;display:flex;justify-content:space-between;"><span>关于</span><span style="color:#999;">›</span></div>
      </div>
      <div style="text-align:center;padding:20px;color:#999;font-size:12px;">Dualler SDK v1.0.0 | Web 平台</div>
    </div>
  `;
}

function render() {
  const el = document.getElementById('app');
  switch (currentPage) {
    case 'index': el.innerHTML = renderIndex(); break;
    case 'detail': el.innerHTML = renderDetail(); break;
    case 'profile': el.innerHTML = renderProfile(); break;
  }
}

function switchPage(page) {
  currentPage = page;
  render();
}

function switchTab(tab) {
  currentPage = tab;
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab)?.classList.add('active');
  render();
}

function addTodo() {
  const input = document.getElementById('newTodo');
  if (input && input.value.trim()) {
    data.todos.push({ text: input.value.trim(), done: false });
    input.value = '';
    render();
  }
}

function clearLog() {
  document.getElementById('console').innerHTML = '';
}

// 初始化
Dualler.log('info', 'Dualler Web 预览启动');
Dualler.log('info', '平台: Web Browser');
render();
</script>

</body>
</html>
